<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KasiConnect — Log In</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-dark d-flex align-items-center justify-content-center" style="height: 100vh; margin:0;">
    <div class="card p-4 shadow-lg mx-3" style="width: 100%; max-width: 400px; border-radius: 12px;">
        <div class="text-center mb-4">
            <h2 class="text-success fw-bold m-0">KasiConnect</h2>
            <small class="text-muted fw-semibold">Township C2C Gateway</small>
        </div>
        <form action="login.php" method="POST">
            <div class="mb-3">
                <label class="form-label small fw-bold text-secondary">Phone Number</label>
                <input type="tel" name="phone_number" class="form-control form-control-lg" placeholder="e.g. 0821112222" required>
            </div>
            <div class="mb-4">
                <label class="form-label small fw-bold text-secondary">Password</label>
                <input type="password" name="password" class="form-control form-control-lg" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-success btn-lg w-100 fw-bold shadow-sm mb-3">Secure Log In</button>
            <div class="text-center"><a href="index.html" class="text-decoration-none small text-success">← Back to Feed</a></div>
        </form>
    </div>
</body>
</html>
